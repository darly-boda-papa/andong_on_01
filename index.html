<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>안동 On (安東 On)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="mx-auto flex min-h-[100dvh] w-full max-w-5xl flex-col">
    <header class="sticky top-0 z-40 border-b border-stone-200/80 bg-andong-paper/95 backdrop-blur-md safe-top">
      <div class="flex items-center justify-between px-4 py-3">
        <a href="#/home" class="flex items-center gap-2.5">
          <span class="flex h-8 w-8 items-center justify-center rounded-full bg-andong-navy text-white shadow-sm">
            <svg class="h-5 w-5 fill-current" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3L2 9h3v10h14V9h3L12 3zm0 2.8L18.2 9H5.8L12 5.8zM7 11h2v6H7v-6zm4 0h2v6h-2v-6zm4 0h2v6h-2v-6z"></path>
            </svg>
          </span>
          <span>
            <span class="flex items-center gap-1.5">
              <span class="font-serif text-lg font-black tracking-tight text-andong-dark">안동 On</span>
              <span class="rounded bg-andong-vermilion/10 px-1.5 py-0.5 text-[10px] font-bold text-andong-vermilion">공식</span>
            </span>
            <span class="block text-[10px] font-medium leading-none text-stone-500">한국 정신문화의 수도</span>
          </span>
        </a>
        <div class="flex items-center gap-1 text-stone-700">
          <button type="button" data-action="refresh" class="rounded-full p-2 transition hover:bg-stone-200/60" aria-label="새로고침">
            <i id="refresh-icon" class="ph ph-arrows-clockwise text-xl"></i>
          </button>
          <a href="#/saved" class="relative rounded-full p-2 transition hover:bg-stone-200/60" aria-label="보관함">
            <i class="ph ph-bookmark-simple text-xl"></i>
            <span id="saved-badge" class="absolute right-1 top-1 hidden min-w-4 rounded-full bg-andong-vermilion px-1 text-center text-[10px] font-bold leading-4 text-white">0</span>
          </a>
        </div>
      </div>
      <nav id="top-nav" class="hidden gap-1 overflow-x-auto px-4 pb-3 md:flex"></nav>
    </header>

    <main id="app" class="flex-1 px-4 py-4"></main>

    <nav id="bottom-nav" class="sticky bottom-0 z-40 flex border-t border-stone-200/90 bg-white/95 px-2 py-1.5 backdrop-blur-md safe-bottom md:hidden"></nav>
  </div>

  <div id="sheet" class="fixed inset-0 z-50 hidden items-end justify-center bg-black/60 p-0 backdrop-blur-sm sm:items-center sm:p-4">
    <div id="sheet-body" class="sheet-enter max-h-[90dvh] w-full overflow-y-auto rounded-t-3xl bg-white p-5 shadow-2xl safe-bottom sm:max-w-md sm:rounded-3xl"></div>
  </div>
  <div id="toasts" class="pointer-events-none fixed left-1/2 top-5 z-50 w-11/12 max-w-sm -translate-x-1/2"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
